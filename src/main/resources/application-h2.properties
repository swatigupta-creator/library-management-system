# ==============================================================
# H2 In-Memory Database Profile (Zero-Setup Instant Testing)
# ==============================================================

server.port=8080

spring.datasource.url=jdbc:h2:mem:library_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.librarian.username=librarian
app.librarian.password=admin123
app.loan.default-duration-days=14
