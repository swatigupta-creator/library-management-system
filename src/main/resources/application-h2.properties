# ==============================================================
# H2 In-Memory Fallback Configuration (For instant zero-setup demo)
# Activate with: --spring.profiles.active=h2
# ==============================================================

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:library_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.librarian.username=librarian
app.librarian.password=admin123
