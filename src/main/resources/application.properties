# ==============================================================
# Library Management System Configuration (MongoDB & Cloud Ready)
# ==============================================================

# Dynamic PORT for Render/Heroku/Cloud or default 8080 locally
server.port=${PORT:8080}

# MongoDB Connection URL (Accepts Render Environment Variable or falls back to local)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/library_db}
spring.data.mongodb.auto-index-creation=true

# Librarian Default Credentials
app.librarian.username=librarian
app.librarian.password=admin123
app.loan.default-duration-days=14
