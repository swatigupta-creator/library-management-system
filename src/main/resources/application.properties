# ==============================================================
# Library Management System Configuration
# Default: File-based H2 Database in MySQL Compatibility Mode
# (Ensures zero-friction startup even when external MySQL is offline)
# ==============================================================

server.port=8080
server.error.whitelabel.enabled=false

# --------------------------------------------------------------
# Database Settings (MySQL Compatibility Mode, Persistent on Disk)
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/library_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --------------------------------------------------------------
# Hibernate / JPA Settings
# --------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Optional H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------------------------------------------------------
# Default Librarian Credentials
# --------------------------------------------------------------
app.librarian.username=librarian
app.librarian.password=admin123
app.loan.default-duration-days=14
